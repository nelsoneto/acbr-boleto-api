version: "3.8"

services:
  acbr-api:
    build: .
    container_name: meu-acbr
    ports:
      - "3001:3001"
    volumes:
      - ./temp:/app/temp
      - ./logs:/app/logs
    environment:
      - DISPLAY=:1
    command: >
      sh -c "rm -f /tmp/.X1-lock &&
             Xvfb :1 -screen 0 1024x768x16 &
             sleep 2 &&
             npm run dev"
    restart: unless-stopped